name: iPad and iPhone build
on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths: ['ios/**', 'src/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build device IPA and test audio engine
        run: bash ios/build.sh
      - name: Upload compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: Click-iOS-unsigned
          path: |
            ios/build/*-ios-unsigned.ipa
            ios/build/SHA256SUMS-ios.txt
          if-no-files-found: error
      - name: Test iPad and iPhone in Simulator
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          available=[d for runtime,items in devices.items() if 'iOS' in runtime for d in items]
          for kind in ['iPad','iPhone']:
            device=next(d for d in available if kind in d['name'])
            print('Testing',kind,device['name'],flush=True)
            subprocess.run(['xcrun','simctl','boot',device['udid']])
            subprocess.run(['xcrun','simctl','bootstatus',device['udid'],'-b'],check=True)
            result=subprocess.run(['xcodebuild','-project','ios/Click.xcodeproj','-scheme','Click','-configuration','Debug','-parallel-testing-enabled','NO','-destination','platform=iOS Simulator,id='+device['udid'],'-derivedDataPath','ios/build/simulator','-resultBundlePath','ios/build/'+kind+'.xcresult','CODE_SIGNING_ALLOWED=NO','test'],stdout=open('ios/build/'+kind+'-test.log','w'),stderr=subprocess.STDOUT)
            subprocess.run(['xcrun','xcresulttool','export','attachments','--path','ios/build/'+kind+'.xcresult','--output-path','ios/build/screenshots/'+kind])
            subprocess.run(['xcrun','xcresulttool','get','test-results','summary','--path','ios/build/'+kind+'.xcresult'])
            subprocess.run(['xcrun','simctl','shutdown',device['udid']])
            if result.returncode:
              print(open('ios/build/'+kind+'-test.log').read()[-18000:]);raise SystemExit(result.returncode)
          PY
      - name: Upload build and simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-validation
          path: |
            ios/build/*.log
            ios/build/*.xcresult
            ios/build/screenshots
          retention-days: 14
